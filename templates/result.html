<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="Stylesheet" href="static/main.css">
    <style>
        body {

            background-image: url('static/29135.jpg');
        }
        .card {
            margin: auto;
            width: 70%;
            height: 70vh;
            margin-top: 200px;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        .progress-bar {
            height: 40px;
            background-color: {{ color }};
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 30px;
            border-radius: 5px;
        }
        .chart-container {
            width: 300px;
            margin: auto;
        }
        .btn-back {
            background-color: #007bff;
            color: white;
            transition: 0.3s;
        }
        .btn-back:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Prediction Result</h2>
        <p style="font-size: 24px; color: {{ color }};"><strong>{{ prediction_text }}</strong></p>
        <p>Confidence Level: {{ confidence|round(2) }}%</p>

        <div class="progress">
            <div class="progress-bar" style="width: {{ confidence }}%;">{{ confidence|round(2) }}%</div>
        </div>

        <br>

        <div class="chart-container">
            <canvas id="confidenceChart"></canvas>
        </div>

        <br>
        <a href="/" class="btn btn-back">Back to Home</a>
    </div>
</div>

<script>
    var ctx = document.getElementById('confidenceChart').getContext('2d');
    var confidenceChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Confidence Level', 'Uncertainty'],
            datasets: [{
                data: [{{ confidence|round(2) }}, {{ 100 - confidence|round(2) }}],
                backgroundColor: ['{{ color }}', '#ddd']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>

</body>
</html>
