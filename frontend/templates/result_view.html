
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>result view page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="Stylesheet" href="static/main.css">
    <style>
        .bg-custom {
            background: url('static/29135.jpg') no-repeat center center/cover;
        }
        .hidden {
            display: none;
        }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        
            .fade-in {
                opacity: 0;
                animation: fadeIn 1s ease forwards;
            }
        
        
    </style>
</head>
<body class="bg-custom min-h-screen flex flex-col items-center p-5">
    <header class="w-full flex justify-between items-center mb-6">
        <div class="text-white text-2xl font-bold">
            <i class="fas fa-atom"></i>
            <p></p>
        </div>
        <nav>
            <ul class="flex space-x-6 text-white text-lg">
                <li><a href="/">Home</a></li>
                <li><a href="/result_view">Result_output (Matrix)</a></li>
                <li><a href="/index">Predict</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
            </ul>
        </nav>
    </header>
    <h1 class="text-white text-4xl font-bold mb-5">EXPLORE OUR MODEL INSIGHTS</h1>
       
    
   <!-- Image Gallery -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

    <img src="static/confusion_matrix_knn.png" class="gallery-item rounded-lg cursor-pointer hover:scale-105 transition" data-category="nature" onclick="openLightbox(this.src)">
    <img src="static/confusion_matrix_logistic_regression.png" class="gallery-item rounded-lg cursor-pointer hover:scale-105 transition" data-category="nature" onclick="openLightbox(this.src)">
    <img src="static/confusion_matrix_random_forest.png" class="gallery-item rounded-lg cursor-pointer hover:scale-105 transition" data-category="nature" onclick="openLightbox(this.src)">
    <img src="static/confusion_matrix_svm.png" class="gallery-item rounded-lg cursor-pointer hover:scale-105 transition" data-category="nature" onclick="openLightbox(this.src)">
    <img src="static/confusion_matrix_xgboost.png" class="gallery-item rounded-lg cursor-pointer hover:scale-105 transition" data-category="nature" onclick="openLightbox(this.src)">
    <img src="static/feature_importance.png" class="gallery-item rounded-lg cursor-pointer hover:scale-105 transition" data-category="nature" onclick="openLightbox(this.src)">
    <img src="static/heart_disease_model1.png" class="gallery-item rounded-lg cursor-pointer hover:scale-105 transition" data-category="nature" onclick="openLightbox(this.src)">
</div>

    
    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black bg-opacity-80 flex justify-center items-center hidden">
        <img id="lightbox-img" class="max-w-full max-h-screen rounded-lg shadow-lg">
        <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white text-3xl bg-gray-800 px-3 py-1 rounded">&times;</button>
    </div>
    
    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }
        function filterImages(category) {
            let images = document.querySelectorAll('.gallery-item');
            images.forEach(img => {
                if (category === 'all' || img.dataset.category === category) {
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }
            });
        }
        // Animate images one by one on page load
        window.addEventListener('DOMContentLoaded', () => {
            const images = document.querySelectorAll('.gallery-item');
            images.forEach((img, index) => {
                setTimeout(() => {
                    img.classList.add('fade-in');
                }, index * 300); // delay each image by 300ms
            });
        });
    </script>
    
</body>
</html>
